<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG HACKING</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            border-radius: 20px;
            background: #15151c;
            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 42px;
        }

        p {
            color: #aaa;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            border-radius: 10px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>AG HACKING</h1>
        <p>Welcome to the official website.</p>
        <a class="btn" href="#">GET STARTED</a>
    </div>

</body>
</html>
